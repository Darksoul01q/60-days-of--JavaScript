<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 1. Global Reset & Page Center */
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* 2. Main Wrapper Container */
      #container {
        text-align: center;
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }

      h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 2rem;
      }

      /* 3. The Profile Card Layout */
      #card {
        background-color: #ffffff;
        border-radius: 16px;
        padding: 30px 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        margin-bottom: 24px;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      /* Subtle lift effect when hovering over the card */
      #card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      }

      /* 4. Rounded Profile Image */
      #image {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #4a90e2;
        background-color: #e4e6eb; /* Placeholder color before image loads */
        margin-bottom: 16px;
      }

      /* 5. Typography Details */
      #username {
        color: #222;
        margin: 10px 0 6px 0;
        font-size: 1.4rem;
      }

      #useremail {
        color: #65676b;
        margin: 0 0 12px 0;
        font-size: 0.95rem;
        word-break: break-all; /* Prevents long emails from breaking layout */
      }

      #userlocation {
        color: #8a8d91;
        margin: 0;
        font-size: 0.9rem;
        font-style: italic;
      }

      /* 6. Modern Interactive Button */
      #generate {
        background-color: #4a90e2;
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }

      #generate:hover {
        background-color: #357abd;
      }

      #generate:active {
        transform: scale(0.98); /* Subtle squish effect when clicked */
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Random user</h1>
      <div id="card">
        <img src="" alt="" id="image" />
        <h2 id="username"></h2>
        <p id="useremail"></p>
        <p id="userlocation"></p>
      </div>

      <button id="generate">Generate New User</button>
    </div>

    <script src="day32.js"></script>
  </body>
</html>
