<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="day33 - weather app.css" />
  </head>
  <header>
    <h1>🌦️Weather App</h1>
  </header>

  <body>
    <div id="container">
      <div id="searchBar">
        <input
          type="text"
          name="weather"
          id="weather"
          placeholder="Search City..."
        />
        <button id="search">Search</button>
      </div>
      <div id="location">
        <p id="city"></p>
      </div>
      <div id="properties">
        <p id="temp"></p>
        <p id="description"></p>
      </div>
      <div id="conditions">
        <p id="humidity"></p>
        <p id="windspeed"></p>
      </div>
    </div>
    <script src="day33 - weather app.js"></script>
  </body>
</html>
