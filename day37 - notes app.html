<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <link rel="stylesheet" href="day37 - notes App.css" />
  </head>
  <body>
    <header>
      <h1 id="heading">Notes app</h1>
    </header>
    <div id="containerform">
      <form type="submit">
        <label for="title"> Title : </label>
        <input
          type="text"
          name="title"
          id="title"
          placeholder="Enter Title..."
        />
        <label for="notes">Notes : </label>
        <input type="text" name="notes" id="notes" placeholder="Type here..." />
        <button id="addnotes">Add Notes</button>
      </form>
    </div>
    <div id="containerScreen">
      <h3 id="subheading">Notes</h3>
      <div id="innercontainer">
        <div id="containerBlock"></div>
        <button id="delete">Delete</button>
      </div>
    </div>
    <script src="day37 - notes app.js"></script>
  </body>
</html>
